<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Estudos OAB 48</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0d0c0a;
  --sur:      #161512;
  --sur2:     #1e1c18;
  --sur3:     #26231e;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.11);
  --text:     #ede9e0;
  --text2:    #8a8478;
  --text3:    #504d47;
  --alta:     #e05c3a;
  --alta-bg:  rgba(224,92,58,0.10);
  --alta-bd:  rgba(224,92,58,0.22);
  --media:    #c8971a;
  --media-bg: rgba(200,151,26,0.10);
  --media-bd: rgba(200,151,26,0.22);
  --baixa:    #4a9e73;
  --baixa-bg: rgba(74,158,115,0.10);
  --baixa-bd: rgba(74,158,115,0.22);
  --done:     #4a9e73;
}

body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; min-height: 100vh; }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 240px; flex-shrink: 0; background: var(--sur); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 24px; padding: 28px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.main { flex: 1; padding: 36px 32px; overflow-x: hidden; }

/* Sidebar */
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand-tag { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; }
.brand-name { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; line-height: 1; }
.brand-sub { font-size: 11px; color: var(--text2); margin-top: 3px; }

.sb-section { display: flex; flex-direction: column; gap: 8px; }
.sb-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

.stat-row { display: flex; justify-content: space-between; align-items: baseline; }
.stat-name { font-size: 12px; color: var(--text2); }
.stat-val { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }

/* Legend */
.leg-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

/* Progress bars sidebar */
.prog-item { display: flex; flex-direction: column; gap: 3px; }
.prog-top { display: flex; justify-content: space-between; font-size: 11px; }
.prog-name { color: var(--text2); }
.prog-val { font-family: 'DM Mono', monospace; color: var(--text3); }
.prog-track { height: 3px; background: var(--sur3); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 3px; border-radius: 99px; }

/* Week nav grid */
.week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.week-btn {
  padding: 5px 3px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--text3); font-family: 'DM Mono', monospace;
  font-size: 10px; cursor: pointer; text-align: center; transition: all 0.13s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.week-btn:hover { background: var(--sur2); color: var(--text2); border-color: var(--border2); }
.week-btn.active { background: var(--sur2); color: var(--text); border-color: var(--border2); font-weight: 500; }
.week-dot { width: 5px; height: 5px; border-radius: 50%; }

/* Main header */
.main-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
.week-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1; }
.week-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }

/* View tabs */
.view-tabs { display: flex; gap: 5px; }
.view-tab {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); font-family: 'DM Sans', sans-serif;
  font-size: 12px; cursor: pointer; transition: all 0.13s;
}
.view-tab.active { background: var(--sur2); color: var(--text); border-color: var(--border2); }

/* Summary cards */
.sum-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 8px; margin-bottom: 24px; }
.sum-card { background: var(--sur); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
.sum-lbl { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.sum-val { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
.sum-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* Week tabs (main) */
.wtabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
.wtab {
  padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); font-size: 11px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all 0.13s;
}
.wtab:hover { color: var(--text); border-color: var(--border2); }
.wtab.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }

/* View panels */
.vpanel { display: none; }
.vpanel.active { display: block; }

/* Day grid */
.day-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 8px; }
.day-col { display: flex; flex-direction: column; gap: 7px; }

.day-hdr {
  text-align: center; padding: 9px 6px 8px;
  background: var(--sur); border: 1px solid var(--border);
  border-radius: 8px;
}
.day-name { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
.day-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); margin-top: 2px; }

.block {
  border-radius: 8px; padding: 9px 9px 8px;
  border: 1px solid; cursor: pointer;
  transition: transform 0.11s, opacity 0.11s;
  position: relative;
}
.block:hover { transform: translateY(-1px); }
.block.alta  { background: var(--alta-bg);  border-color: var(--alta-bd); }
.block.media { background: var(--media-bg); border-color: var(--media-bd); }
.block.baixa { background: var(--baixa-bg); border-color: var(--baixa-bd); }
.block.done  { opacity: 0.45; }
.block.done .block-name { text-decoration: line-through; }

.block-pill {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: 8px;
  text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 5px;
  border-radius: 3px; margin-bottom: 5px;
}
.alta  .block-pill { background: rgba(224,92,58,0.18);  color: var(--alta); }
.media .block-pill { background: rgba(200,151,26,0.18); color: var(--media); }
.baixa .block-pill { background: rgba(74,158,115,0.18); color: var(--baixa); }

.block-name { font-size: 11px; font-weight: 500; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
.block-time { font-family: 'DM Mono', monospace; font-size: 10px; }
.alta  .block-time { color: rgba(224,92,58,0.6); }
.media .block-time { color: rgba(200,151,26,0.6); }
.baixa .block-time { color: rgba(74,158,115,0.6); }

.chk {
  position: absolute; top: 7px; right: 7px;
  width: 15px; height: 15px; border-radius: 4px;
  border: 1px solid var(--border2); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.13s; flex-shrink: 0;
}
.block.done .chk { background: var(--done); border-color: var(--done); }

/* Dist view */
.dist-list { display: flex; flex-direction: column; gap: 5px; }
.dist-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px; background: var(--sur);
  border: 1px solid var(--border); border-radius: 8px;
}
.dist-rank { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); width: 18px; }
.dist-name { font-size: 12px; color: var(--text); width: 170px; flex-shrink: 0; }
.dist-bar-wrap { flex: 1; height: 5px; background: var(--sur3); border-radius: 99px; overflow: hidden; }
.dist-bar { height: 5px; border-radius: 99px; }
.dist-hrs { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); width: 35px; text-align: right; }
.dist-badge { font-family: 'DM Mono', monospace; font-size: 8px; padding: 2px 6px; border-radius: 3px; width: 40px; text-align: center; flex-shrink: 0; }
.b-alta  { background: var(--alta-bg);  color: var(--alta); }
.b-media { background: var(--media-bg); color: var(--media); }
.b-baixa { background: var(--baixa-bg); color: var(--baixa); }

/* Progress view */
.prog-list { display: flex; flex-direction: column; gap: 10px; }
.prog-card {
  background: var(--sur); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px 16px;
}
.prog-card-hdr { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 12px; }
.prog-card-name { color: var(--text); font-weight: 500; }
.prog-card-pct { font-family: 'DM Mono', monospace; color: var(--text2); }
.prog-card-bar-track { height: 5px; background: var(--sur3); border-radius: 99px; overflow: hidden; }
.prog-card-bar-fill { height: 5px; border-radius: 99px; background: var(--done); transition: width 0.3s; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--sur3); border-radius: 99px; }

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 18px 16px; }
  .main { padding: 20px 14px; }
  .day-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
</style>
</head>
<body>
<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="brand">
    <span class="brand-tag">Plano de estudos</span>
    <span class="brand-name">OAB<br>2027</span>
    <span class="brand-sub">3 meses · 20 matérias · 234h</span>
  </div>

  <div class="sb-section">
    <span class="sb-label">Carga</span>
    <div class="stat-row"><span class="stat-name">Seg – Sáb</span><span class="stat-val">3h/dia</span></div>
    <div class="stat-row"><span class="stat-name">Domingo</span><span class="stat-val">folga</span></div>
    <div class="stat-row" style="border-top:1px solid var(--border); padding-top:7px; margin-top:2px;">
      <span class="stat-name">Total</span><span class="stat-val" style="color:#c8b99a;">234h</span>
    </div>
  </div>

  <div class="sb-section">
    <span class="sb-label">Prioridade</span>
    <div class="leg-item"><div class="leg-dot" style="background:var(--alta)"></div>Alta — 55% do tempo</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--media)"></div>Média — 30% do tempo</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--baixa)"></div>Baixa — 15% do tempo</div>
  </div>

  <div class="sb-section">
    <span class="sb-label">Distribuição</span>
    <div id="sb-dist"></div>
  </div>

  <div class="sb-section">
    <span class="sb-label">Semanas</span>
    <div class="week-grid" id="week-nav"></div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="main-hdr">
    <div>
      <div class="week-title" id="main-title">Semana 1</div>
      <div class="week-sub" id="main-sub"></div>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" onclick="switchView('cronograma',this)">Cronograma</button>
      <button class="view-tab" onclick="switchView('distribuicao',this)">Distribuição</button>
      <button class="view-tab" onclick="switchView('progresso',this)">Progresso</button>
    </div>
  </div>

  <div class="sum-cards" id="sum-cards"></div>
  <div class="wtabs" id="wtabs"></div>

  <div class="vpanel active" id="vp-cronograma">
    <div class="day-grid" id="day-grid"></div>
  </div>
  <div class="vpanel" id="vp-distribuicao">
    <div class="dist-list" id="dist-list"></div>
  </div>
  <div class="vpanel" id="vp-progresso">
    <div class="prog-list" id="prog-list"></div>
  </div>
</main>
</div>

<script>
const DIAS_PT = {Thursday:'Qui',Friday:'Sex',Saturday:'Sáb',Monday:'Seg',Tuesday:'Ter',Wednesday:'Qua'};
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

date":"2026-10-06","weekday":"Tuesday","s1":"Direito Penal","s2":"Dir. Tributário"},{"date":"2026-10-07","weekday":"Wednesday","s1":"Proc. do Trabalho","s2":"Dir. Consumidor"}],[{"date":"2026-10-08","weekday":"Thursday","s1":"Direito Penal","s2":"Dir. Tributário"},{"date":"2026-10-09","weekday":"Friday","s1":"Proc. do Trabalho","s2":"Dir. Consumidor"},{"date":"2026-10-10","weekday":"Saturday","s1":"Direito Penal","s2":"Dir. Tributário"},{"date":"2026-10-12","weekday":"Monday","s1":"Proc. do Trabalho","s2":"Dir. Consumidor"},{"date":"2026-10-13","weekday":"Tuesday","s1":"Direito Penal","s2":"Dir. Tributário"},{"date":"2026-10-14","weekday":"Wednesday","s1":"Proc. do Trabalho","s2":"Dir. Administrativo"}],[{"date":"2026-10-15","weekday":"Thursday","s1":"Direito Penal","s2":"Filosofia do Dir."},{"date":"2026-10-16","weekday":"Friday","s1":"Proc. do Trabalho","s2":"Dir. Administrativo"},{"date":"2026-10-17","weekday":"Saturday","s1":"Direito Penal","s2":"Filosofia do Dir."},{"date":"2026-10-19","weekday":"Monday","s1":"Proc. do Trabalho","s2":"Dir. Administrativo"},{"date":"2026-10-20","weekday":"Tuesday","s1":"Direito Penal","s2":"Filosofia do Dir."},{"date":"2026-10-21","weekday":"Wednesday","s1":"Processo Civil","s2":"Dir. Administrativo"}],[{"date":"2026-10-22","weekday":"Thursday","s1":"Direito Penal","s2":"Filosofia do Dir."},{"date":"2026-10-23","weekday":"Friday","s1":"Processo Civil","s2":"Dir. Administrativo"},{"date":"2026-10-24","weekday":"Saturday","s1":"Direito Penal","s2":"Filosofia do Dir."},{"date":"2026-10-26","weekday":"Monday","s1":"Processo Civil","s2":"Dir. Administrativo"},{"date":"2026-10-27","weekday":"Tuesday","s1":"Direito Penal","s2":"Filosofia do Dir."},{"date":"2026-10-28","weekday":"Wednesday","s1":"Processo Civil","s2":"Dir. Constitucional"}],[{"date":"2026-10-29","weekday":"Thursday","s1":"Direito do Trabalho","s2":"Dir. Empresarial"},{"date":"2026-10-30","weekday":"Friday","s1":"Processo Civil","s2":"Dir. Constitucional"},{"date":"2026-10-31","weekday":"Saturday","s1":"Direito do Trabalho","s2":"Dir. Empresarial"},{"date":"2026-11-02","weekday":"Monday","s1":"Processo Civil","s2":"Dir. Constitucional"},{"date":"2026-11-03","weekday":"Tuesday","s1":"Direito do Trabalho","s2":"Dir. Empresarial"},{"date":"2026-11-04","weekday":"Wednesday","s1":"Processo Civil","s2":"Dir. Constitucional"}],[{"date":"2026-11-05","weekday":"Thursday","s1":"Direito do Trabalho","s2":"Dir. Empresarial"},{"date":"2026-11-06","weekday":"Friday","s1":"Processo Civil","s2":"Dir. Constitucional"},{"date":"2026-11-07","weekday":"Saturday","s1":"Direito do Trabalho","s2":"Dir. Empresarial"},{"date":"2026-11-09","weekday":"Monday","s1":"Processo Civil","s2":"Dir. Ambiental"},{"date":"2026-11-10","weekday":"Tuesday","s1":"Direito do Trabalho","s2":"ECA"},{"date":"2026-11-11","weekday":"Wednesday","s1":"Processo Civil","s2":"Dir. Ambiental"}],[{"date":"2026-11-12","weekday":"Thursday","s1":"Direito do Trabalho","s2":"ECA"},{"date":"2026-11-13","weekday":"Friday","s1":"Processo Civil","s2":"Dir. Ambiental"},{"date":"2026-11-14","weekday":"Saturday","s1":"Direito do Trabalho","s2":"ECA"},{"date":"2026-11-16","weekday":"Monday","s1":"Processo Civil","s2":"Ética e Estatuto"},{"date":"2026-11-17","weekday":"Tuesday","s1":"Direito do Trabalho","s2":"Dir. Eleitoral"},{"date":"2026-11-18","weekday":"Wednesday","s1":"Processo Civil","s2":"Ética e Estatuto"}],[{"date":"2026-11-19","weekday":"Thursday","s1":"Direito do Trabalho","s2":"Dir. Eleitoral"},{"date":"2026-11-20","weekday":"Friday","s1":"Processo Civil","s2":"Direito Civil"},{"date":"2026-11-21","weekday":"Saturday","s1":"Direito do Trabalho","s2":"Direito Civil"},{"date":"2026-11-23","weekday":"Monday","s1":"Processo Civil","s2":"Direito do Trabalho"},{"date":"2026-11-24","weekday":"Tuesday","s1":"Dir. Financeiro","s2":"Processo Civil"},{"date":"2026-11-25","weekday":"Wednesday","s1":"Dir. Previdenciário","s2":"Dir. Financeiro"}],[{"date":"2026-11-26","weekday":"Thursday","s1":"Dir. Financeiro","s2":"Dir. Previdenciário"},{"date":"2026-11-27","weekday":"Friday","s1":"Dir. Previdenciário","s2":"Dir. Financeiro"},{"date":"2026-11-28","weekday":"Saturday","s1":"Dir. Financeiro","s2":"Dir. Previdenciário"},{"date":"2026-11-30","weekday":"Monday","s1":"Dir. Previdenciário","s2":"Dir. Financeiro"},{"date":"2026-12-01","weekday":"Tuesday","s1":"Dir. Financeiro","s2":"Dir. Previdenciário"},{"date":"2026-12-02","weekday":"Wednesday","s1":"Dir. Previdenciário","s2":"Dir. Financeiro"}],[{"date":"2026-12-03","weekday":"Thursday","s1":"Dir. Financeiro","s2":"Dir. Previdenciário"},{"date":"2026-12-04","weekday":"Friday","s1":"Dir. Previdenciário","s2":"Processo Penal"},{"date":"2026-12-05","weekday":"Saturday","s1":"Processo Penal","s2":null},{"date":"2026-12-07","weekday":"Monday","s1":"Processo Penal","s2":null},{"date":"2026-12-08","weekday":"Tuesday","s1":"Processo Penal","s2":null},{"date":"2026-12-09","weekday":"Wednesday","s1":"Processo Penal","s2":null}]];

// State
let currentWeek = 0;
let done = JSON.parse(localStorage.getItem('oab48_done') || '{}');

function saveDone() { localStorage.setItem('oab48_done', JSON.stringify(done)); }

function fmtDate(str) {
  const d = new Date(str + 'T12:00:00');
  return `${d.getDate()} ${MESES[d.getMonth()]}`;
}

function pLabel(p) { return p === 'alta' ? 'alta' : p === 'media' ? 'média' : 'baixa'; }

function toggleDone(key, e) {
  e.stopPropagation();
  done[key] = !done[key];
  saveDone();
  renderWeek(currentWeek);
}

// Sidebar distribution
function renderSbDist() {
  const sorted = Object.entries(horas).sort((a,b)=>b[1]-a[1]);
  const maxH = sorted[0][1];
  const col = m => prioridade[m]==='alta'?'var(--alta)':prioridade[m]==='media'?'var(--media)':'var(--baixa)';
  document.getElementById('sb-dist').innerHTML = sorted.slice(0,8).map(([m,h])=>`
    <div class="prog-item">
      <div class="prog-top"><span class="prog-name">${m}</span><span class="prog-val">${h}h</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${Math.round(h/maxH*100)}%; background:${col(m)};"></div></div>
    </div>`).join('');
}

// Week nav
function renderWeekNav() {
  const col = wi => {
    const s = semanas[wi];
    const f = s.find(d=>d.s1)?.s1;
    return prioridade[f]==='alta'?'var(--alta)':prioridade[f]==='media'?'var(--media)':'var(--baixa)';
  };
  document.getElementById('week-nav').innerHTML = semanas.map((_,i)=>`
    <button class="week-btn${i===currentWeek?' active':''}" onclick="selectWeek(${i})">
      <div class="week-dot" style="background:${col(i)}"></div>S${i+1}
    </button>`).join('');
}

// Summary cards
function renderSummary(wi) {
  const days = semanas[wi];
  const totalBlocks = days.flatMap(d=>[d.s1,d.s2].filter(Boolean)).length;
  const doneCount = days.flatMap((d,di)=>[0,1].map(si=>`w${wi}_d${di}_s${si}`)).filter(k=>done[k]).length;
  const pct = totalBlocks ? Math.round(doneCount/totalBlocks*100) : 0;
  const dateStart = fmtDate(days[0].date);
  const dateEnd   = fmtDate(days[days.length-1].date);
  document.getElementById('sum-cards').innerHTML = `
    <div class="sum-card"><div class="sum-lbl">Semana</div><div class="sum-val">${wi+1}<span style="font-size:11px;color:var(--text3);font-family:'DM Sans'">/13</span></div><div class="sum-sub">${dateStart} – ${dateEnd}</div></div>
    <div class="sum-card"><div class="sum-lbl">Horas</div><div class="sum-val">18<span style="font-size:11px;color:var(--text3);">h</span></div><div class="sum-sub">3h × 6 dias</div></div>
    <div class="sum-card"><div class="sum-lbl">Concluído</div><div class="sum-val" style="color:var(--baixa)">${pct}<span style="font-size:11px;color:var(--text3);">%</span></div><div class="sum-sub">${doneCount}/${totalBlocks} blocos</div></div>
  `;
}

// Main week tabs (all 13)
function renderWtabs() {
  document.getElementById('wtabs').innerHTML = semanas.map((_,i)=>`
    <button class="wtab${i===currentWeek?' active':''}" onclick="selectWeek(${i})">S${i+1}</button>`).join('');
}

// Day grid
function renderDayGrid(wi) {
  const days = semanas[wi];
  let html = '';
  days.forEach((day, di) => {
    const slots = [day.s1, day.s2].filter(Boolean);
    html += `<div class="day-col">
      <div class="day-hdr">
        <div class="day-name">${DIAS_PT[day.weekday] || day.weekday}</div>
        <div class="day-date">${fmtDate(day.date)}</div>
      </div>`;
    slots.forEach((m, si) => {
      const p = prioridade[m] || 'baixa';
      const key = `w${wi}_d${di}_s${si}`;
      const isDone = !!done[key];
      html += `<div class="block ${p}${isDone?' done':''}" id="blk_${key}">
        <div class="chk" onclick="toggleDone('${key}',event)">
          ${isDone?'<svg width="9" height="9" viewBox="0 0 9 9"><polyline points="1.5,4.5 3.5,6.5 7.5,2.5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
        </div>
        <div class="block-pill">${pLabel(p)}</div>
        <div class="block-name">${m}</div>
        <div class="block-time">1.5h</div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('day-grid').innerHTML = html;
}

// Distribution view
function renderDist() {
  const sorted = Object.entries(horas).sort((a,b)=>b[1]-a[1]);
  const maxH = sorted[0][1];
  const col = m => prioridade[m]==='alta'?'var(--alta)':prioridade[m]==='media'?'var(--media)':'var(--baixa)';
  const bcls = m => prioridade[m]==='alta'?'b-alta':prioridade[m]==='media'?'b-media':'b-baixa';
  document.getElementById('dist-list').innerHTML = sorted.map(([m,h],i)=>`
    <div class="dist-row">
      <span class="dist-rank">${String(i+1).padStart(2,'0')}</span>
      <span class="dist-name">${m}</span>
      <div class="dist-bar-wrap"><div class="dist-bar" style="width:${Math.round(h/maxH*100)}%; background:${col(m)};"></div></div>
      <span class="dist-hrs">${h}h</span>
      <span class="dist-badge ${bcls(m)}">${pLabel(prioridade[m])}</span>
    </div>`).join('');
}

// Progress view
function renderProgress() {
  // Total blocks per matéria
  const totalByM = {};
  const doneByM  = {};
  Object.keys(horas).forEach(m=>{ totalByM[m]=0; doneByM[m]=0; });
  semanas.forEach((sem,wi)=>{
    sem.forEach((day,di)=>{
      [day.s1,day.s2].forEach((m,si)=>{
        if (!m) return;
        totalByM[m]++;
        if (done[`w${wi}_d${di}_s${si}`]) doneByM[m]++;
      });
    });
  });
  const allBlocks = Object.values(totalByM).reduce((a,b)=>a+b,0);
  const allDone   = Object.values(doneByM).reduce((a,b)=>a+b,0);
  const globalPct = allBlocks ? Math.round(allDone/allBlocks*100) : 0;

  const sorted = Object.entries(horas).sort((a,b)=>b[1]-a[1]);
  const col = m => prioridade[m]==='alta'?'var(--alta)':prioridade[m]==='media'?'var(--media)':'var(--baixa)';

  document.getElementById('prog-list').innerHTML = `
    <div class="prog-card">
      <div class="prog-card-hdr">
        <span class="prog-card-name" style="font-size:14px;">Progresso geral</span>
        <span class="prog-card-pct">${allDone}/${allBlocks} · ${globalPct}%</span>
      </div>
      <div class="prog-card-bar-track"><div class="prog-card-bar-fill" style="width:${globalPct}%"></div></div>
    </div>
    ${sorted.map(([m])=>{
      const t = totalByM[m]; const d2 = doneByM[m];
      const pct2 = t ? Math.round(d2/t*100) : 0;
      return `<div class="prog-card">
        <div class="prog-card-hdr">
          <span class="prog-card-name">${m}</span>
          <span class="prog-card-pct">${d2}/${t} · ${pct2}%</span>
        </div>
        <div class="prog-card-bar-track"><div class="prog-card-bar-fill" style="width:${pct2}%; background:${col(m)};"></div></div>
      </div>`;
    }).join('')}`;
}

// Week title/sub
const FOCOS = [
  'Penal + Proc. do Trabalho + D. Humanos + Internacional',
  'Penal + Proc. do Trabalho + D. Humanos + Internacional',
  'Penal + Proc. do Trabalho + Tributário + Consumidor',
  'Penal + Proc. do Trabalho + Tributário + Consumidor',
  'Penal + Proc. do Trabalho + Tributário + Administrativo',
  'Penal + Proc. do Trabalho + Filosofia + Administrativo',
  'Penal + Proc. Civil + Filosofia + Constitucional',
  'D. Trabalho + Proc. Civil + Empresarial + Constitucional',
  'D. Trabalho + Proc. Civil + Empresarial + Ambiental/ECA',
  'D. Trabalho + Proc. Civil + ECA + Ética + Eleitoral',
  'D. Trabalho + Proc. Civil + Civil + consolidação',
  'Financeiro + Previdenciário — foco total nas novas matérias',
  'Financeiro + Previdenciário + Proc. Penal — sprint final',
];

function renderWeek(wi) {
  currentWeek = wi;
  document.getElementById('main-title').textContent = `Semana ${wi+1}`;
  document.getElementById('main-sub').textContent = FOCOS[wi] || '';
  renderWeekNav();
  renderWtabs();
  renderSummary(wi);
  renderDayGrid(wi);
  renderDist();
  renderProgress();
}

function selectWeek(i) { renderWeek(i); }

function switchView(name, btn) {
  document.querySelectorAll('.vpanel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('vp-'+name).classList.add('active');
  btn.classList.add('active');
}

// Init
renderSbDist();
renderWeek(0);
</script>
</body>
</html>
